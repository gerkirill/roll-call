kind = "web"
previewPath = "/"
title = "Перекличка"
version = "1.0.0"
id = "artifacts/perekladychka"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22183

[services.development]
run = "pnpm --filter @workspace/perekladychka run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/perekladychka", "run", "build" ]
serve = "static"
publicDir = "artifacts/perekladychka/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22183"
BASE_PATH = "/"
